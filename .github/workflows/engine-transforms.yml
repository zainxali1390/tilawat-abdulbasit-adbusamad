# Recognition engine, step 5: clip-quality estimators (js/engine/features.js) on the step-5 test set.
name: Engine transforms
on:
  workflow_dispatch:
  push:
    paths: ['tools/engine/eval/TRANSFORMS_RUN', '.github/workflows/engine-transforms.yml']
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}', fetch-depth: 1, sparse-checkout: "tools\njs"}
      - uses: actions/download-artifact@v4
        with: {name: testset, path: set, run-id: '45686748504', github-token: '${{ github.token }}'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          D=$(ls -d tools/engine/eval/results/2026*/ | sort | tail -1)
          node tools/engine/eval/test_transforms.mjs set | tee ${D}transforms-score.txt
          git config user.name "engine-eval bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/engine/eval/results
          git commit -q -m "Engine eval: transforms results" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*10)); done
